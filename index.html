        const Counter = ({ label, value, icon }) => {
            const [count, setCount] = useState(0);
            useEffect(() => {
                let frame;
                let start;
                const duration = 1800;
                const animate = (timestamp) => {
                    if (!start) start = timestamp;
                    const progress = Math.min((timestamp - start) / duration, 1);
                    setCount(Math.floor(progress * value));
                    if (progress < 1) {
                        frame = requestAnimationFrame(animate);
                    }
                };
                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [value]);

            return (
                <motion.div
                    initial={{ opacity: 0, y: 16 }}
                    whileInView={{ opacity: 1, y: 0 }}
                    viewport={{ once: true, amount: 0.3 }}
                    className="relative flex flex-col gap-3 overflow-hidden rounded-2xl border border-slate-800/50 bg-slate-900/60 p-6 backdrop-blur-lg transition hover:-translate-y-2 hover:border-brand-400/60 hover:shadow-2xl hover:shadow-brand-500/20"

            });

            useEffect(() => {
                document.documentElement.classList.toggle('dark', dark);
                localStorage.setItem('rt-theme', dark ? 'dark' : 'light');

            return [dark, setDark];

        const GithubStats = ({ username }) => {
            const [stats, setStats] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                const controller = new AbortController();
                fetch(`https://api.github.com/users/${username}`, { signal: controller.signal })
                    .then((res) => {
                        if (!res.ok) throw new Error('Unable to fetch GitHub stats right now.');
                        return res.json();
                    })
                    .then((data) => {
                        setStats({
                            repos: data.public_repos,
                            followers: data.followers,
                            following: data.following,
                            avatar: data.avatar_url,
                            bio: data.bio,
                            url: data.html_url,
                        });
                    })
                    .catch((err) => {
                        if (err.name !== 'AbortError') setError(err.message);
                    })
                    .finally(() => setLoading(false));

                return () => controller.abort();
            }, [username]);

            if (loading) {
                return (
                    <motion.div className="flex items-center gap-3 rounded-2xl border border-slate-800/60 bg-slate-900/60 p-6 backdrop-blur">
                        <div className="h-10 w-10 animate-spin rounded-full border-2 border-brand-400 border-t-transparent"></div>
                        <span className="text-sm text-slate-400">Fetching live GitHub activity…</span>
                    </motion.div>
                );
            }

                return (
                    <motion.div className="rounded-2xl border border-red-500/40 bg-red-500/10 p-6 text-sm text-red-200">
                        Unable to load GitHub stats right now. {error}
